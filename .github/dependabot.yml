version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      # Must stay above minor-and-patch: a dependency joins the first group it matches.
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "eslint-config-next"
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime is Node 22 (.nvmrc); don't offer types for newer majors.
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci(deps)" }
